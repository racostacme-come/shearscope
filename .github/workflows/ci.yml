name: Build and validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror cpp/element.hpp cpp/bindings.cpp cpp/test_element.cpp
      - run: python -m pytest --cov=shearscope --cov-report=term-missing
      - run: cmake -S . -B build/native -DSHEARSCOPE_PYTHON=OFF
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: python -m build
      - run: python examples/cantilever.py
      - run: shearscope campaign --output out
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            out/
            dist/
